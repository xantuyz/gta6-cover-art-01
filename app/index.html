<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — multi-panel poster cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app" id="dropzone">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photos, turned into a bold multi-panel poster cover. 100% offline — your photo never leaves this browser.</p>

    <label class="field">Photos
      <input id="photos" type="file" accept="image/*" multiple>
      <span class="hint">Or drop photos anywhere on this page. One photo fills the hero panel; more photos fill the smaller panels.</span>
    </label>
    <button id="sample" type="button" class="ghost">Load sample photos</button>

    <fieldset>
      <legend>Layout</legend>
      <div class="row">
        <button type="button" data-layout="grid" class="active">Vice Grid</button>
        <button type="button" data-layout="strip">Sunset Strip</button>
        <button type="button" data-layout="trio">Neon Trio</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div class="row">
        <button type="button" data-theme="sunset" class="active">Sunset Vice City</button>
        <button type="button" data-theme="neon">Neon Night</button>
        <button type="button" data-theme="dusk">Palm Dusk</button>
      </div>
    </fieldset>

    <label class="field">Title
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label class="field">Sub-caption
      <input id="subcaption" type="text" maxlength="60" value="Vice City Nights">
    </label>
    <div class="row2">
      <label class="field">Caption position
        <select id="captionPos">
          <option value="bottom" selected>Bottom</option>
          <option value="middle">Middle</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label class="field">Title colour
        <select id="captionColor">
          <option value="#ffffff" selected>White</option>
          <option value="#ffd23f">Sunset gold</option>
          <option value="#ff5ea8">Hot pink</option>
          <option value="#00f0ff">Neon cyan</option>
        </select>
      </label>
    </div>

    <fieldset>
      <legend>Selected panel</legend>
      <label class="field">Panel
        <select id="panel"></select>
      </label>
      <label class="field">Zoom <span id="zoomLabel"></span>
        <input id="zoom" type="range" min="50" max="300" value="100">
      </label>
      <div class="row">
        <button id="rotate" type="button" class="ghost">Rotate 90°</button>
        <button id="fit" type="button" class="ghost">Reset fit</button>
      </div>
      <p class="hint">Tip: drag a photo inside its panel to move it, click a panel to select it.</p>
    </fieldset>

    <fieldset>
      <legend>Export size</legend>
      <div class="row">
        <button type="button" data-size="1080x1080" class="active">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
        <button type="button" data-size="1920x1080">1920 × 1080</button>
      </div>
    </fieldset>

    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <div class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
