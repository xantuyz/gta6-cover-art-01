<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — multi-panel poster cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photos, a sunset poster cover. 100% offline — your photos never leave this browser.</p>

    <label class="dropzone" id="dropzone" for="photo">
      <span class="dropzone-title">Add photos</span>
      <span class="dropzone-hint">or drop up to 3 photos here</span>
      <input id="photo" type="file" accept="image/*" multiple>
    </label>

    <label>Layout
      <select id="layout">
        <option value="vice-grid">Vice Grid</option>
        <option value="sunset-strip">Sunset Strip</option>
        <option value="neon-trio">Neon Trio</option>
      </select>
    </label>

    <label>Grade
      <select id="theme">
        <option value="sunset">Sunset Vice City</option>
        <option value="neon">Neon Night</option>
        <option value="dusk">Palm Dusk</option>
      </select>
    </label>

    <label>Photos across panels
      <select id="mode">
        <option value="all">One photo, all panels</option>
        <option value="per">One photo per panel</option>
      </select>
    </label>

    <label>Title
      <input id="title" type="text" maxlength="40" value="Sunset Heist">
    </label>

    <label>Sub-caption
      <input id="sub" type="text" maxlength="40" value="Vice City Nights">
    </label>

    <div class="row">
      <label>Title position
        <select id="position">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
          <option value="center">Centre</option>
        </select>
      </label>
      <label>Title colour
        <select id="color">
          <option value="white">White</option>
          <option value="yellow">Neon yellow</option>
          <option value="pink">Hot pink</option>
        </select>
      </label>
    </div>

    <fieldset class="panel-tools">
      <legend id="panel-label">Selected panel 1 of 3 (photo panel)</legend>
      <label>Zoom
        <input id="zoom" type="range" min="50" max="300" value="100">
      </label>
      <div class="row buttons">
        <button id="rotate" type="button">Rotate 90°</button>
        <button id="fit" type="button">Fit</button>
        <button id="fill" type="button">Fill</button>
      </div>
      <p class="hint">Click a panel to select it. Drag it to move the photo, scroll to zoom.</p>
    </fieldset>

    <fieldset class="export-box">
      <legend>Export size</legend>
      <label class="radio"><input type="radio" name="exportSize" value="1080x1080" checked> 1080 × 1080</label>
      <label class="radio"><input type="radio" name="exportSize" value="1080x1350"> 1080 × 1350</label>
      <label class="radio"><input type="radio" name="exportSize" value="1920x1080"> 1920 × 1080</label>
    </fieldset>

    <button id="export" type="button" class="export-btn">Export PNG</button>
    <p id="status" role="status"></p>
  </aside>

  <section class="stage" aria-label="Live cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
