<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — multi-panel poster cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photos, made into a bold multi-panel poster cover. 100% offline — your photos never leave this browser.</p>

    <label class="field">Photos
      <input id="photos" type="file" accept="image/*" multiple>
      <span class="hint">Upload your own, or use the two bundled samples.</span>
    </label>

    <fieldset>
      <legend>Layout</legend>
      <div class="row">
        <button type="button" data-layout="vice-grid" class="active">Vice Grid</button>
        <button type="button" data-layout="sunset-strip">Sunset Strip</button>
        <button type="button" data-layout="neon-trio">Neon Trio</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div class="row">
        <button type="button" data-grade="sunset" class="active">Sunset Vice City</button>
        <button type="button" data-grade="neon">Neon Night</button>
        <button type="button" data-grade="palm-dusk">Palm Dusk</button>
      </div>
    </fieldset>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="VICE CITY NIGHTS">
    </label>
    <label class="field">Sub-caption
      <input id="subCaption" type="text" maxlength="60" value="A STORY IN EVERY PANEL">
    </label>
    <div class="row">
      <label class="field">Caption colour
        <select id="captionColor">
          <option value="white">White</option>
          <option value="yellow">Neon yellow</option>
          <option value="pink">Hot pink</option>
        </select>
      </label>
      <label class="field">Caption position
        <select id="captionPos">
          <option value="bottom">Bottom</option>
          <option value="middle">Middle</option>
          <option value="top">Top</option>
        </select>
      </label>
    </div>

    <fieldset>
      <legend>Selected panel</legend>
      <label class="field">Panel
        <select id="panelSelect"></select>
      </label>
      <label class="field">Zoom
        <input id="zoom" type="range" min="0.5" max="3" step="0.05" value="1">
      </label>
      <div class="row">
        <button id="rotate" type="button">Rotate 90°</button>
        <button id="fit" type="button">Reset crop</button>
        <button id="nextPhoto" type="button">Next photo</button>
      </div>
      <p class="hint">Tip: drag a panel on the cover to pan its photo, scroll over it to zoom.</p>
    </fieldset>

    <fieldset>
      <legend>Export size</legend>
      <div class="row">
        <label><input type="radio" name="exportSize" value="square" checked> 1080×1080</label>
        <label><input type="radio" name="exportSize" value="portrait"> 1080×1350</label>
        <label><input type="radio" name="exportSize" value="wide"> 1920×1080</label>
      </div>
    </fieldset>

    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Live cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
