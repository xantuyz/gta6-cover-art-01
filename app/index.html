<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photos, made into a multi-panel poster cover. 100% offline — your photo never leaves this browser.</p>

    <label class="field">Photos
      <input id="photo" type="file" accept="image/*" multiple>
      <span class="hint">Pick several photos, or drop them on the preview.</span>
    </label>

    <fieldset>
      <legend>Layout</legend>
      <div class="btn-row">
        <button class="layout-btn active" type="button" data-layout="vice-grid">Vice Grid</button>
        <button class="layout-btn" type="button" data-layout="sunset-strip">Sunset Strip</button>
        <button class="layout-btn" type="button" data-layout="neon-trio">Neon Trio</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div class="btn-row">
        <button class="theme-btn active" type="button" data-theme="sunset">Sunset Vice City</button>
        <button class="theme-btn" type="button" data-theme="neon">Neon Night</button>
        <button class="theme-btn" type="button" data-theme="dusk">Palm Dusk</button>
      </div>
    </fieldset>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="SUNSET HEIST">
    </label>
    <label class="field">Sub-caption
      <input id="subcaption" type="text" maxlength="60" value="A POSTER FROM YOUR PHOTOS">
    </label>

    <div class="row">
      <label class="field">Caption position
        <select id="captionPos">
          <option value="bottom" selected>Bottom</option>
          <option value="middle">Middle</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label class="field">Caption colour
        <select id="captionColor">
          <option value="white" selected>White</option>
          <option value="yellow">Neon yellow</option>
          <option value="pink">Hot pink</option>
        </select>
      </label>
    </div>

    <label class="field">Photos across panels
      <select id="fillMode">
        <option value="per-panel" selected>One photo per panel</option>
        <option value="one-photo">One photo, all panels</option>
      </select>
    </label>

    <fieldset>
      <legend>Selected panel</legend>
      <label class="field">Panel
        <select id="panel"></select>
      </label>
      <label class="field">Zoom <span id="zoomValue">1.00x</span>
        <input id="zoom" type="range" min="0.5" max="3" step="0.05" value="1">
      </label>
      <div class="btn-row">
        <button id="rotate" type="button">Rotate 90°</button>
        <button id="fit" type="button">Fit</button>
        <button id="fill" type="button">Fill</button>
      </div>
      <p class="hint">Tip: drag a photo on the preview to move it, scroll to zoom.</p>
    </fieldset>

    <fieldset>
      <legend>Export size</legend>
      <div class="btn-row">
        <label class="radio"><input type="radio" name="size" value="1080x1080" checked> 1080 × 1080</label>
        <label class="radio"><input type="radio" name="size" value="1080x1350"> 1080 × 1350</label>
        <label class="radio"><input type="radio" name="size" value="1920x1080"> 1920 × 1080</label>
      </div>
    </fieldset>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" id="dropZone" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
